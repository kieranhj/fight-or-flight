# Manual ops check: fetch the telemetry recorder's health JSON from the deployed
# Worker and print it in the job log. Useful when you (or an agent) can't reach
# *.workers.dev directly. Run from the Actions tab (workflow_dispatch).
name: Telemetry Health

on:
  workflow_dispatch:
    inputs:
      path:
        description: 'Worker path to fetch (history + route diagnostics only)'
        required: false
        default: '/api/history/health'
      summary:
        description: 'Print a compact summary instead of the full JSON (for big flight lists)'
        required: false
        type: boolean
        default: false
  # Also runs when this file itself changes in a PR — which both smoke-tests the
  # workflow and lets an agent trigger a health check before it lands on main.
  pull_request:
    paths:
      - '.github/workflows/telemetry-health.yml'

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch from the Worker
        env:
          REQ_PATH: ${{ inputs.path || '/api/history/health' }}
          SUMMARY: ${{ inputs.summary }}
        run: |
          case "$REQ_PATH" in
            /api/history/*) ;;
            # Read-only route diagnostics: /api/route probes every candidate
            # provider, /api/route-lookup is the cached production path.
            /api/route|/api/route\?*) ;;
            /api/route-lookup\?*) ;;
            *) echo "::error::path must start with /api/history/ or /api/route"; exit 1 ;;
          esac
          curl -sS --max-time 120 \
            "https://aircraft-complaint-proxy.kieranhj.workers.dev$REQ_PATH" \
            > /tmp/resp.json
          if [ "$SUMMARY" = "true" ]; then
            # Flight lists run to thousands of lines; print counts instead. Route
            # coverage is the number we actually check after a backfill.
            python3 - <<'PY'
          import json
          d = json.load(open('/tmp/resp.json'))
          fl = d.get('flights')
          if not isinstance(fl, list):
              print(json.dumps(d, indent=2)[:4000]); raise SystemExit
          withroute = [f for f in fl if f.get('origin_icao') or f.get('destination_icao')]
          movements = [f for f in fl if f.get('airport') and f.get('movement')]
          mv_route = [f for f in movements if f.get('origin_icao') or f.get('destination_icao')]
          print(f"flights           : {len(fl)}")
          print(f"with any route    : {len(withroute)}")
          print(f"airport movements : {len(movements)}")
          print(f"  of those, routed: {len(mv_route)}")
          for f in withroute[:12]:
              print(f"  {f.get('callsign')or'?':10s} {f.get('origin_label')or f.get('origin_icao')or'?':>18s}"
                    f" -> {f.get('destination_label')or f.get('destination_icao')or'?'}")
          PY
          else
            python3 -m json.tool < /tmp/resp.json
          fi
